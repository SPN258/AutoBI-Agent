          cat > app/src/test/java/io/legado/app/model/analyzeRule/PersonalReaderFixtureRuleTest.kt <<'EOF'
          package io.legado.app.model.analyzeRule

          import android.app.Application
          import io.legado.app.data.entities.BookSource
          import io.legado.app.utils.GSON
          import io.legado.app.utils.fromJsonObject
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Before
          import org.junit.Test
          import org.junit.runner.RunWith
          import org.robolectric.RobolectricTestRunner
          import org.robolectric.RuntimeEnvironment
          import org.robolectric.annotation.Config
          import splitties.init.injectAsAppCtx

          @RunWith(RobolectricTestRunner::class)
          @Config(application = Application::class, sdk = [34])
          class PersonalReaderFixtureRuleTest {

              @Before
              fun setUp() {
                  RuntimeEnvironment.getApplication().injectAsAppCtx()
              }

              private fun fixture(name: String): String {
                  val stream = javaClass.classLoader!!.getResourceAsStream("personalReader/$name")
                      ?: error("missing fixture: $name")
                  return stream.bufferedReader().use { it.readText() }
              }

              private fun source(): BookSource =
                  GSON.fromJsonObject<BookSource>(fixture("book_source.json")).getOrThrow()

              @Test
              fun `real Legado model and AnalyzeRule parse search detail toc and content fixtures`() {
                  val source = source()

                  assertEquals("Personal Reader Fixture", source.bookSourceName)
                  assertTrue(source.searchUrl!!.contains("{{key}}"))
                  assertTrue(source.searchUrl!!.contains("{{page}}"))

                  val search = AnalyzeRule(RuleData(), source).setContent(fixture("search.html"))
                  val searchItem = search.getElements(source.getSearchRule().bookList!!).single()
                  assertEquals("原创测试小说", search.getString(source.getSearchRule().name, searchItem))
                  assertEquals("测试作者", search.getString(source.getSearchRule().author, searchItem))

                  val detail = AnalyzeRule(RuleData(), source).setContent(fixture("detail.html"))
                  assertEquals("原创测试小说", detail.getString(source.getBookInfoRule().name))
                  assertEquals("测试作者", detail.getString(source.getBookInfoRule().author))
                  assertTrue(detail.getString(source.getBookInfoRule().intro).contains("原创测试详情"))

                  val toc1 = AnalyzeRule(RuleData(), source).setContent(fixture("toc_page_1.html"))
                  val tocItems = toc1.getElements(source.getTocRule().chapterList!!)
                  assertEquals(2, tocItems.size)
                  assertEquals("第一章 起点", toc1.getString(source.getTocRule().chapterName, tocItems[0]))
                  assertEquals("第二章 转折", toc1.getString(source.getTocRule().chapterName, tocItems[1]))
                  assertEquals("/book/1/toc?page=2", toc1.getString(source.getTocRule().nextTocUrl))

                  val toc2 = AnalyzeRule(RuleData(), source).setContent(fixture("toc_page_2.html"))
                  val toc2Items = toc2.getElements(source.getTocRule().chapterList!!)
                  assertEquals(1, toc2Items.size)
                  assertEquals("第三章 收束", toc2.getString(source.getTocRule().chapterName, toc2Items[0]))

                  val chapter1Page1 = AnalyzeRule(RuleData(), source)
                      .setContent(fixture("chapter_1_page_1.html"))
                  assertTrue(chapter1Page1.getString(source.getContentRule().content).contains("第一章第一页"))
                  assertEquals(
                      "/book/1/chapter/1?page=2",
                      chapter1Page1.getString(source.getContentRule().nextContentUrl)
                  )

                  val chapter1Page2 = AnalyzeRule(RuleData(), source)
                      .setContent(fixture("chapter_1_page_2.html"))
                  val page2Content = chapter1Page2.getString(source.getContentRule().content)
                  assertTrue(page2Content.contains("第一章第二页"))
                  assertFalse(page2Content.contains("第二章正文哨兵"))
                  assertEquals("", chapter1Page2.getString(source.getContentRule().nextContentUrl))
              }

              @Test
              fun `malformed source json fails explicitly instead of producing a source`() {
                  val result = GSON.fromJsonObject<BookSource>("{\"bookSourceName\":")
                  assertTrue(result.isFailure)
              }
          }
          EOF

