          cat > app/src/main/java/io/legado/app/utils/SensitiveLogRedactor.kt <<'EOF'
          package io.legado.app.utils

          object SensitiveLogRedactor {
              private const val REDACTED = "[REDACTED]"

              private val headerPattern = Regex(
                  """(?im)\b(Authorization|Proxy-Authorization|Cookie|Set-Cookie|X-Api-Key|Api-Key)\s*:\s*[^\r\n]+"""
              )

              private val assignmentPattern = Regex(
                  """(?i)\b(access[_-]?token|refresh[_-]?token|token|password|passwd|pwd|secret|api[_-]?key|authorization|cookie)=([^&\s]+)"""
              )

              private val jsonPattern = Regex(
                  """(?i)(["']?(?:access[_-]?token|refresh[_-]?token|token|password|passwd|pwd|secret|api[_-]?key|authorization|cookie)["']?\s*:\s*)(["'])(.*?)(\2)"""
              )

              fun redact(value: String?): String {
                  if (value == null) return ""
                  var safe = headerPattern.replace(value) { match ->
                      "${match.groupValues[1]}: $REDACTED"
                  }
                  safe = jsonPattern.replace(safe) { match ->
                      "${match.groupValues[1]}${match.groupValues[2]}$REDACTED${match.groupValues[2]}"
                  }
                  safe = assignmentPattern.replace(safe) { match ->
                      "${match.groupValues[1]}=$REDACTED"
                  }
                  return safe
              }

              fun redactThrowable(throwable: Throwable?): Throwable? {
                  throwable ?: return null
                  return RuntimeException(redact(throwable.toString())).apply {
                      stackTrace = throwable.stackTrace
                  }
              }
          }
          EOF

          cat > app/src/main/java/io/legado/app/constant/AppLog.kt <<'EOF'
          package io.legado.app.constant

          import android.util.Log
          import io.legado.app.BuildConfig
          import io.legado.app.domain.gateway.OtherSettingsGateway
          import io.legado.app.utils.LogUtils
          import io.legado.app.utils.SensitiveLogRedactor
          import io.legado.app.utils.toastOnUi
          import org.koin.core.context.GlobalContext
          import splitties.init.appCtx

          object AppLog {

              private val otherGateway by lazy { GlobalContext.get().get<OtherSettingsGateway>() }

              private val mLogs = arrayListOf<Triple<Long, String, Throwable?>>()

              val logs get() = mLogs.toList()

              @Synchronized
              fun put(message: String?, throwable: Throwable? = null, toast: Boolean = false) {
                  message ?: return
                  if (toast) {
                      appCtx.toastOnUi(message)
                  }
                  if (mLogs.size > 100) {
                      mLogs.removeLastOrNull()
                  }
                  val safeMessage = SensitiveLogRedactor.redact(message)
                  val safeThrowable = SensitiveLogRedactor.redactThrowable(throwable)
                  if (safeThrowable == null) {
                      LogUtils.d("AppLog", safeMessage)
                  } else {
                      LogUtils.d("AppLog", "$safeMessage\n${SensitiveLogRedactor.redact(safeThrowable.stackTraceToString())}")
                  }
                  mLogs.add(0, Triple(System.currentTimeMillis(), safeMessage, safeThrowable))
                  if (BuildConfig.DEBUG) {
                      val stackTrace = Thread.currentThread().stackTrace
                      if (safeThrowable == null) {
                          Log.e(stackTrace[3].className, safeMessage)
                      } else {
                          Log.e(
                              stackTrace[3].className,
                              "$safeMessage\n${SensitiveLogRedactor.redact(safeThrowable.stackTraceToString())}"
                          )
                      }
                  }
              }

              @Synchronized
              fun putNotSave(message: String?, throwable: Throwable? = null, toast: Boolean = false) {
                  message ?: return
                  if (toast) {
                      appCtx.toastOnUi(message)
                  }
                  if (mLogs.size > 100) {
                      mLogs.removeLastOrNull()
                  }
                  val safeMessage = SensitiveLogRedactor.redact(message)
                  val safeThrowable = SensitiveLogRedactor.redactThrowable(throwable)
                  mLogs.add(0, Triple(System.currentTimeMillis(), safeMessage, safeThrowable))
                  if (BuildConfig.DEBUG) {
                      val stackTrace = Thread.currentThread().stackTrace
                      if (safeThrowable == null) {
                          Log.e(stackTrace[3].className, safeMessage)
                      } else {
                          Log.e(
                              stackTrace[3].className,
                              "$safeMessage\n${SensitiveLogRedactor.redact(safeThrowable.stackTraceToString())}"
                          )
                      }
                  }
              }

              @Synchronized
              fun clear() {
                  mLogs.clear()
              }

              fun putDebug(message: String?, throwable: Throwable? = null) {
                  if (otherGateway.currentSettings.recordLog) {
                      put(message, throwable)
                  }
              }

          }
          EOF

          cat > app/src/main/java/io/legado/app/utils/DebugLog.kt <<'EOF'
          package io.legado.app.utils

          import android.util.Log
          import io.legado.app.BuildConfig

          object DebugLog {

              fun e(tag: String, throwable: Throwable) {
                  if (BuildConfig.DEBUG) {
                      Log.e(tag, SensitiveLogRedactor.redact(throwable.stackTraceToString()))
                  }
              }

              fun e(tag: String, msg: String, throwable: Throwable? = null) {
                  if (BuildConfig.DEBUG) {
                      Log.e(tag, merged(msg, throwable))
                  }
              }

              fun d(tag: String, msg: String, throwable: Throwable? = null) {
                  if (BuildConfig.DEBUG) {
                      Log.d(tag, merged(msg, throwable))
                  }
              }

              fun i(tag: String, msg: String, throwable: Throwable? = null) {
                  if (BuildConfig.DEBUG) {
                      Log.i(tag, merged(msg, throwable))
                  }
              }

              fun w(tag: String, msg: String, throwable: Throwable? = null) {
                  if (BuildConfig.DEBUG) {
                      Log.w(tag, merged(msg, throwable))
                  }
              }

              private fun merged(msg: String, throwable: Throwable?): String {
                  val safeMessage = SensitiveLogRedactor.redact(msg)
                  if (throwable == null) return safeMessage
                  return "$safeMessage\n${SensitiveLogRedactor.redact(throwable.stackTraceToString())}"
              }
          }
          EOF

