          @Composable
          fun PersonalSearchScreen(
              onSearch: (String?) -> Unit,
              onManageSources: () -> Unit,
              onRemoteImport: () -> Unit,
              onLocalImport: () -> Unit,
          ) {
              var query by rememberSaveable { mutableStateOf("") }
              val keyboard = LocalSoftwareKeyboardController.current
              val scrollBehavior = GlassTopAppBarDefaults.defaultScrollBehavior()

              fun submit() {
                  val value = query.trim()
                  keyboard?.hide()
                  onSearch(value.ifEmpty { null })
              }

              AppScaffold(
                  topBar = {
                      GlassMediumFlexibleTopAppBar(
                          title = stringResource(R.string.personal_search_title),
                          scrollBehavior = scrollBehavior,
                      )
                  }
              ) { padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(
                              adaptiveContentPadding(
                                  top = padding.calculateTopPadding(),
                                  bottom = 120.dp,
                              )
                          ),
                      verticalArrangement = Arrangement.spacedBy(16.dp),
                  ) {
                      Text(stringResource(R.string.personal_search_subtitle))

                      OutlinedTextField(
                          value = query,
                          onValueChange = { query = it },
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true,
                          label = { Text(stringResource(R.string.personal_search_hint)) },
                          leadingIcon = { Icon(Icons.Default.Search, contentDescription = null) },
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                          keyboardActions = KeyboardActions(onSearch = { submit() }),
                      )

                      Button(
                          onClick = { submit() },
                          modifier = Modifier.fillMaxWidth(),
                      ) {
                          Icon(Icons.Default.Search, contentDescription = null)
                          Text(
                              text = stringResource(R.string.personal_search_action),
                              modifier = Modifier.padding(start = 8.dp),
                          )
                      }

                      Card(modifier = Modifier.fillMaxWidth()) {
                          Column(
                              modifier = Modifier.padding(16.dp),
                              verticalArrangement = Arrangement.spacedBy(12.dp),
                          ) {
                              Text(stringResource(R.string.personal_sources_title))
                              OutlinedButton(
                                  onClick = onManageSources,
                                  modifier = Modifier.fillMaxWidth(),
                              ) {
                                  Icon(Icons.Default.Source, contentDescription = null)
                                  Text(
                                      stringResource(R.string.personal_manage_sources),
                                      modifier = Modifier.padding(start = 8.dp),
                                  )
                              }
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                              ) {
                                  OutlinedButton(
                                      onClick = onRemoteImport,
                                      modifier = Modifier.weight(1f),
                                  ) {
                                      Icon(Icons.Default.Link, contentDescription = null)
                                      Text(
                                          stringResource(R.string.personal_remote_import),
                                          modifier = Modifier.padding(start = 6.dp),
                                      )
                                  }
                                  OutlinedButton(
                                      onClick = onLocalImport,
                                      modifier = Modifier.weight(1f),
                                  ) {
                                      Icon(Icons.Default.FileOpen, contentDescription = null)
                                      Text(
                                          stringResource(R.string.personal_local_import),
                                          modifier = Modifier.padding(start = 6.dp),
                                      )
                                  }
                              }
                          }
                      }

                      Card(modifier = Modifier.fillMaxWidth()) {
                          Text(
                              text = stringResource(R.string.personal_privacy_note),
                              modifier = Modifier.padding(16.dp),
                          )
                      }
                  }
              }
          }
