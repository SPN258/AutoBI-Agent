          cat > app/src/test/java/io/legado/app/utils/SensitiveLogRedactorTest.kt <<'EOF'
          package io.legado.app.utils

          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class SensitiveLogRedactorTest {

              @Test
              fun `redacts headers query parameters assignments and json secrets`() {
                  val raw = """
                      Authorization: Bearer top-secret
                      Cookie: session=abc123
                      https://fixture.invalid/path?token=query-secret&safe=1
                      password=form-secret
                      {"api_key":"json-secret","refresh_token":"refresh-secret","title":"keep-me"}
                  """.trimIndent()

                  val safe = SensitiveLogRedactor.redact(raw)

                  assertTrue(safe.contains("[REDACTED]"))
                  assertTrue(safe.contains("safe=1"))
                  assertTrue(safe.contains("keep-me"))
                  assertFalse(safe.contains("top-secret"))
                  assertFalse(safe.contains("abc123"))
                  assertFalse(safe.contains("query-secret"))
                  assertFalse(safe.contains("form-secret"))
                  assertFalse(safe.contains("json-secret"))
                  assertFalse(safe.contains("refresh-secret"))
              }

              @Test
              fun `redacted throwable keeps stack location but not secret message`() {
                  val original = IllegalStateException("token=boom-secret")
                  original.stackTrace = arrayOf(StackTraceElement("Example", "call", "Example.kt", 7))

                  val safe = SensitiveLogRedactor.redactThrowable(original)!!

                  assertFalse(safe.toString().contains("boom-secret"))
                  assertTrue(safe.toString().contains("[REDACTED]"))
                  assertTrue(safe.stackTrace.contentEquals(original.stackTrace))
              }
          }
          EOF

