      - name: Run focused tests
        working-directory: legado
        env:
          APP_VERSION_NAME: 1.0.0
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew             testAppDebugUnitTest             --tests io.legado.app.utils.SensitiveLogRedactorTest             --tests io.legado.app.model.analyzeRule.PersonalReaderFixtureRuleTest             --tests io.legado.app.ui.main.PersonalReaderBrandingTest             --no-daemon             --no-configuration-cache | tee ../focused-tests.log

      - name: Run repository verification and build custom APK
        working-directory: legado
        env:
          APP_VERSION_NAME: 1.0.0
        run: |
          set -o pipefail
          ./gradlew             testAppDebugUnitTest             lintAppDebug             verifyConfigArchitecture             assembleAppDebug             --continue             --no-daemon             --no-configuration-cache | tee ../full-build.log

      - name: Collect APK and provenance
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d legado/app/build/outputs/apk ]; then
            find legado/app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} out/ \;
          fi
          cp PERSONAL_READER_PATCH.diff out/ || true
          cp focused-tests.log out/ || true
          cp full-build.log out/ || true
          {
            echo "UPSTREAM_REPO=HapeLee/legado-with-MD3"
            echo "UPSTREAM_SHA=05fd81de7878462936f2652966207e8f985296aa"
            echo "CUSTOM_VERSION=1.0.0"
            echo "WORKFLOW_REPO=SPN258/AutoBI-Agent"
            echo "WORKFLOW_RUN=$GITHUB_RUN_ID"
            echo "WORKFLOW_SHA=$GITHUB_SHA"
          } > out/BUILD_PROVENANCE.txt
          (cd out && sha256sum * > SHA256SUMS.txt || true)
          find out -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload custom APK and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: personal-reader-overhaul
          if-no-files-found: warn
          path: out/**
          retention-days: 30
