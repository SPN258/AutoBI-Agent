              "import io.legado.app.ui.main.home.HomeRouteScreen\n",
              "import io.legado.app.feature.searchhome.PersonalSearchScreen\n",
              1,
          )
          pattern = re.compile(
              r"\s+MainDestination\.Home -> HomeRouteScreen\([\s\S]*?\n\s+\)\n\n\s+MainDestination\.Bookshelf ->",
