                                  onRemoteImport = onNavigateToRemoteImport,
                                  onLocalImport = onNavigateToLocalImport,
                              )

                              MainDestination.Bookshelf ->"""
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit("MainScreen Home block not replaced")
          p.write_text(s)

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationIdSuffix = ".debug"', 'applicationIdSuffix = ".private"', 1)
          s = s.replace('versionNameSuffix = "_debug"', 'versionNameSuffix = "-private"', 1)
          p.write_text(s)
